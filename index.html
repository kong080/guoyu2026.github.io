<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08435F">
<title>2026 国誉博</title>
<style>
:root{
  --navy:#08435F; --navy2:#0b4d6c; --dk:#05283a;
  --gold:#C49C17; --gold2:#a88415; --goldL:#e8d192;
  --cream:#FDF7E5; --cream2:#f7eeda;
  --green:#2B6F61; --ink:#23313a; --sub:#717c72;
  --line:#e7dfca;
  --r:16px; --r2:12px;
  --shadow:0 1px 0 rgba(8,67,95,.04);
  --stars:radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,244,214,.55) 50%, transparent 51%),
          radial-gradient(1px 1px at 60% 16%, rgba(255,244,214,.45) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 82% 40%, rgba(255,244,214,.5) 50%, transparent 51%),
          radial-gradient(1px 1px at 38% 62%, rgba(255,244,214,.4) 50%, transparent 51%),
          radial-gradient(1.4px 1.4px at 12% 70%, rgba(255,244,214,.4) 50%, transparent 51%),
          radial-gradient(1px 1px at 92% 72%, rgba(255,244,214,.42) 50%, transparent 51%),
          radial-gradient(1px 1px at 50% 84%, rgba(255,244,214,.4) 50%, transparent 51%),
          radial-gradient(1.2px 1.2px at 26% 48%, rgba(255,244,214,.5) 50%, transparent 51%),
          radial-gradient(1px 1px at 72% 6%, rgba(255,244,214,.35) 50%, transparent 51%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
.app{max-width:640px;margin:0 auto;padding-bottom:120px;position:relative}

/* ===== 顶部 星空展馆 ===== */
.hero{position:relative;background:
  radial-gradient(120% 90% at 50% -10%, #0a5678 0%, var(--navy) 42%, var(--dk) 100%);
  color:var(--cream);padding:26px 20px 22px;overflow:hidden;border-radius:0 0 30px 30px}
.hero::before{content:"";position:absolute;inset:0;background:var(--stars);
  background-size:320px 240px;opacity:.9;pointer-events:none}
.hero::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--goldL) 30%,var(--gold) 50%,var(--goldL) 70%,transparent)}
.hero .hrow{position:relative;text-align:center}
.hero .kicker{font-size:11px;letter-spacing:.42em;color:var(--goldL);font-weight:600;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.hero .kicker::before,.hero .kicker::after{content:"◆";font-size:8px;color:var(--gold);letter-spacing:0}
.hero h1{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:.12em;color:#fff}
.hero .sub{margin:0 0 18px;font-size:12.5px;color:rgba(253,247,229,.72);letter-spacing:.18em}
.hero .star1,.hero .star2,.hero .star3{position:absolute;color:var(--goldL);opacity:.85;pointer-events:none}
.hero .star1{top:16px;left:18px;font-size:10px;animation:tw 3s ease-in-out infinite}
.hero .star2{top:22px;right:26px;font-size:8px;animation:tw 2.6s 1s ease-in-out infinite}
.hero .star3{bottom:44px;left:34%;font-size:9px;animation:tw 3.4s .6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

/* 搜索 展馆入场券 */
.search{position:relative;margin-top:6px;display:flex;align-items:center;gap:9px;
  background:var(--cream);border:1px solid var(--gold);border-radius:999px;padding:10px 15px;
  box-shadow:0 4px 0 rgba(5,40,58,.28)}
.search svg{flex:none;color:var(--gold2)}
.search input{border:0;outline:0;background:transparent;font-size:14.5px;width:100%;color:var(--ink)}
.search input::placeholder{color:#b4ab93}
.search .q{font-size:11px;color:var(--gold2);white-space:nowrap;font-weight:600}

/* ===== 筛选 ===== */
.filters{padding:10px 16px 6px;position:sticky;top:0;z-index:45;
  background:linear-gradient(var(--cream) 88%, rgba(253,247,229,.0));backdrop-filter:blur(6px)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6.5px 14px;border-radius:999px;border:1px solid rgba(8,67,95,.28);background:transparent;
  font-size:12.5px;color:var(--navy);cursor:pointer;transition:all .15s;font-weight:600;letter-spacing:.02em}
.chip.on{background:var(--navy);color:var(--cream);border-color:var(--navy);box-shadow:0 2px 6px rgba(8,67,95,.25)}
.chip.spec{border-color:rgba(43,111,97,.4);color:var(--green);background:rgba(43,111,97,.05)}
.chip.spec.on{background:var(--green);color:#f4f9f2;border-color:var(--green);box-shadow:0 2px 6px rgba(43,111,97,.25)}
.fhint{font-size:11px;color:var(--sub);padding:0 2px 2px;margin-top:-2px}

/* ===== 品牌 展牌 ===== */
.group{margin:6px 14px 18px}
.ghead{display:flex;align-items:center;gap:10px;padding:18px 4px 12px;cursor:pointer;user-select:none}
.ghead .ln{flex:0 0 34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));opacity:.75}
.ghead .ln.r{transform:rotate(180deg)}
.ghead .diamond{color:var(--gold);font-size:9px;flex:none}
.ghead .gt{flex:1;text-align:center;min-width:0}
.ghead .gt .bn{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:.06em;line-height:1.2;
  display:inline-flex;align-items:baseline;gap:8px}
.ghead .gt .bn .g{color:var(--gold);font-size:14px}
.ghead .gt .sn{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:.05em}
.ghead .cnt{font-size:11px;color:var(--gold2);flex:none;background:rgba(196,156,23,.12);
  border:1px solid rgba(196,156,23,.35);padding:2.5px 9px;border-radius:999px;font-weight:600}

/* ===== 网格 展柜 ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{background:#fffdf6;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow)}
.cshot{position:relative;aspect-ratio:1/1;background:#efe8d6}
.cshot .imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.cshot .imgs::-webkit-scrollbar{display:none}
.cshot .imgs img{width:100%;flex:none;height:100%;object-fit:cover;scroll-snap-align:start;background:#efe8d6}
/* 无图占位 展品待陈列 */
.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 52%,var(--green) 130%);color:var(--cream);
  text-align:center;padding:12px;position:relative;overflow:hidden}
.placeholder::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1.4px 1.4px at 18% 22%, rgba(255,244,214,.5) 50%, transparent 51%),
  radial-gradient(1px 1px at 74% 34%, rgba(255,244,214,.42) 50%, transparent 51%),
  radial-gradient(1.2px 1.2px at 44% 78%, rgba(255,244,214,.4) 50%, transparent 51%),
  radial-gradient(1px 1px at 88% 70%, rgba(255,244,214,.4) 50%, transparent 51%);
  background-size:180px 140px}
.placeholder .big{font-size:34px;font-weight:800;color:var(--goldL);opacity:1;position:relative}
.placeholder .ring{width:46px;height:46px;border:1px dashed rgba(232,209,146,.6);border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative}
.placeholder .sm{font-size:11px;opacity:.9;margin-top:8px;line-height:1.35;color:var(--cream);
  position:relative;padding:0 8px;letter-spacing:.02em}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(8,67,95,.28);transition:.2s}
.dots i.on{background:var(--gold);transform:scale(1.35)}
.badge{position:absolute;left:8px;top:8px;background:var(--gold);color:#fffdf6;font-size:10px;font-weight:700;
  padding:3.5px 8px;border-radius:7px;letter-spacing:.03em}
.qbadge{position:absolute;left:8px;top:8px;background:#2b6f61;color:#fffdf6;font-size:10px;font-weight:700;
  padding:3.5px 8px;border-radius:7px;letter-spacing:.03em;z-index:2}
.cbody{padding:10px 12px 12px;background:#fffdf6}
.cname{font-size:13.5px;font-weight:700;line-height:1.38;min-height:38px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cprice{margin-top:6px;font-size:11px;color:var(--sub);min-height:20px;display:flex;align-items:baseline}
.cprice b{color:var(--gold2);font-size:17px;font-weight:800;margin-left:2px}
.cprice .yen{color:var(--gold2);font-size:12px;font-weight:800}
.cprice .flag{color:var(--green);font-weight:700}
.cprice s{opacity:.5;margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:44px;overflow:hidden}
.tag{font-size:10.5px;line-height:1;padding:4.5px 8px;border-radius:7px;font-weight:600;color:var(--navy);
  background:rgba(8,67,95,.07);border:1px solid rgba(8,67,95,.12)}
.tag.c{color:#fff;border:0}
.cnote{margin-top:7px;font-size:11px;color:var(--sub);line-height:1.45}

/* ===== 攻略 手册 ===== */
.guide{padding:6px 14px 40px}
.gcard{background:#fffdf6;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;
  box-shadow:var(--shadow)}
.gcard .gh{padding:13px 14px 11px;font-size:15px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px;
  border-bottom:1px dashed var(--line)}
.gcard .gh .dot{width:8px;height:8px;border-radius:50%;flex:none}
.gcard .gb{padding:12px 14px 14px}
.gcard .gb h5{margin:0 0 3px;font-size:12px;color:var(--gold2);font-weight:800;letter-spacing:.04em}
.gcard .gb p{margin:0 0 8px;font-size:13px;line-height:1.62;color:var(--ink)}
.gcard .gb .rowt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gcard .gb .pil{padding:5px 9px;border-radius:8px;background:rgba(8,67,95,.06);font-size:11.5px;color:var(--navy)}
.gcard .gb .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.gcard .gb .tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.gcard .gb .tbl td:first-child{color:var(--gold2);font-weight:800;white-space:nowrap;padding-right:8px}
.gcard .heat{font-size:11px;color:var(--sub);margin-top:2px}
.gimg{display:flex;gap:6px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.gimg::-webkit-scrollbar{display:none}
.gimg figure{flex:none;margin:0;width:74%;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#f2eada}
.gimg figure img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#f2eada}
.gimg figure.one{width:100%}
.gimg figcaption{font-size:11px;color:var(--sub);padding:5px 9px 7px;line-height:1.35;background:#fffdf6}

.empty{text-align:center;color:var(--sub);font-size:13px;padding:48px 20px}
.empty::before{content:"◆  ";color:var(--gold);font-size:11px}

/* ===== 底部 导航 阶梯 ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:640px;margin:0 auto;padding:0 12px 12px;
  pointer-events:none}
.nav .bar{pointer-events:auto;background:linear-gradient(180deg,var(--navy),var(--dk));
  border:1px solid rgba(232,209,146,.18);border-radius:18px;box-shadow:0 6px 18px rgba(5,40,58,.35);
  display:flex;padding:6px}
.nav button{flex:1;border:0;background:transparent;padding:7px 0 6px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:rgba(253,247,229,.55);border-radius:13px;transition:all .18s}
.nav button.on{color:#fffdf6;background:rgba(196,156,23,.22)}
.nav button .n{font-size:10.5px;font-weight:600;letter-spacing:.03em}
.nav button.on .n{color:var(--goldL)}
.nav button svg{width:21px;height:21px}
.nav button:first-child svg{width:23px;height:23px}

@media (prefers-reduced-motion:reduce){
  .hero .star1,.hero .star2,.hero .star3{animation:none}
}
</style>
</head>

function ccolor(token){
  const t = token.replace(/[0-9()（）]/g,"").replace(/色$|款$|样式$|图案$|主题|风|系列/g,"");
  if(COLORHEX[t]){const c=COLORHEX[t];return {c:c, light:c==="#ffffff"||c==="#f2ead9"}}
  for(const k in COLORHEX){ if(t.includes(k)){ const c=COLORHEX[k]; return {c,light:c==="#ffffff"||c==="#f2ead9"}} }
  return null;
}

function splitCol(col){
  return String(col||"").split(/[\/、,，;；&＋+·\s]+/).filter(x=>x&&x.length>0);
}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function searchAll(p){ const q=state.q.trim().toLowerCase();
  if(!q) return true;
  const hay=[p.brand,p.series,p.name,p.sub,p.spec,p.col,p.note].join(" ").toLowerCase();
  return hay.includes(q);
}
function filterZone(zone){
  if(zone==="联名限定"){
    return DATA.filter(p=>(p.z==="限定"||p.z==="联名") && (!state.brand||p.brand===state.brand) && (!state.cat||p.cat===state.cat) && (!state.spec||String(p.spec).includes(state.spec)) && searchAll(p));
  }
  return DATA.filter(p=>p.z===zone && (!state.brand||p.brand===state.brand) && (!state.cat||p.cat===state.cat) && (!state.spec||String(p.spec).includes(state.spec)) && searchAll(p));
}

function dots(html){
  const n=html; let out="";
  for(let i=0;i<n;i++)out+=`<i${i===0?' class="on"':''}></i>`;
  return out;
}

function cardHTML(p){
  let shot;
  const qbadge = p.q?`<div class="qbadge">上海限${p.q}</div>`:"";
  if(p.img.length){
    let imgs=p.img.map((s,i)=>`<img src="${s}?v=2" loading="lazy" decoding="async" onpointerup="sw(this)">`).join("");
    shot=`<div class="cshot">${qbadge}<div class="imgs">${imgs}</div>${p.img.length>1?`<div class="dots">${dots(p.img.length)}</div>`:""}</div>`;
  }else{
    shot=`<div class="cshot"><div class="placeholder">
      <div class="ring"><div class="big">${esc(p.name.replace(/[限定手机淘宝]/g,"").slice(0,1))}</div></div>
      <div class="sm">${esc(p.name)}</div></div>${qbadge}</div>`;
  }
  let pr="";
  if(p.pr!=null && p.pr!==undefined){
    const dec=Number.isInteger(p.pr)?'':'';
    pr=`<div class="cprice"><span class="yen">¥</span><b>${p.pr}</b></div>`;
  }else{
    pr=`<div class="cprice"><span class="flag">${p.brand==='KOKUYO限定'||p.brand.startsWith('STUDY')? '现场限定':'进店见'}</span></div>`;
  }
  let tags="";
  splitCol(p.col).slice(0,6).forEach(t=>{
    const cc=ccolor(t);
    if(cc){ tags+=`<span class="tag c" style="background:${cc.c};color:${cc.light?'#4a463f':'#fff'}">${esc(t)}</span>`; }
    else{ tags+=`<span class="tag">${esc(t)}</span>`; }
  });
  const note = p.note?`<div class="cnote">${esc(p.note)}</div>`:"";
  return `<div class="card">
    ${shot}
    <div class="cbody">
      <div class="cname">${esc(p.name)}</div>
      ${pr}
      ${tags?`<div class="tags">${tags}</div>`:""}
      ${note}
    </div></div>`;
}

function renderShots(container){
  container.querySelectorAll(".imgs").forEach(w=>w.addEventListener("scroll",()=>{
    const d=Math.round(w.scrollLeft/w.clientWidth);
    const dots=w.parentElement.querySelector(".dots");
    if(dots){[...dots.children].forEach((i,k)=>i.classList.toggle("on",k===d));}
  }));
}
window.sw=function(img){
  const w=img.parentElement; w.scrollBy({left:w.clientWidth,top:0,behavior:"smooth"});
};

function groupBy(list,key){
  const m=new Map(); list.forEach(o=>{ const k=o[key]; if(!m.has(k))m.set(k,[]); m.get(k).push(o); });
  return [...m.entries()];
}

function render(){
  const z=state.z;
  if(z==="攻略"){ renderGuide(); return; }
  const zone=filterZone(z);
  const q=state.q.trim(); if(q) document.getElementById("qcount").textContent=`${zone.length}条`;
  let fh=`<div class="row">`+
    CATS[z].map(c=>`<button class="chip${state.cat===c?' on':''}" onclick="setCat('${c}')">${c}</button>`).join("")+`</div>`;
  if(state.cat===""||state.cat==="全部"||state.cat==="本册"||state.cat==="包袋"){
    fh+=`<div class="row">`+SPECS.map(s=>{
      const count=zone.filter(p=>String(p.spec).includes(s)).length;
      return count?`<button class="chip spec${state.spec===s?' on':''}" onclick="setSpec('${esc(s)}')">${s} ${count}</button>`:"";
    }).join("")+`</div>`;
  }
  document.getElementById("filters").innerHTML=fh;

  let html="";
  if(z==="联名限定"){
    // 限定品：不按品牌分组，直接平铺
    const limited=zone.filter(p=>p.z==="限定");
    const cobranded=zone.filter(p=>p.z==="联名");
    if(limited.length){
      html+=`<div class="group"><div class="ghead"><span class="ln"></span><span class="diamond">◆</span><div class="gt"><div class="bn">KOKUYO 限定<span class="g">&amp;</span></div><div class="sn">现场限定商品</div></div><span class="diamond">◆</span><span class="ln r"></span></div><div class="grid">${limited.map(cardHTML).join("")}</div></div>`;
    }
    // 联名品：按品牌分组
    const coGroups=groupBy(cobranded,"brand");
    coGroups.forEach(([brand,list])=>{
      const on=state.brand===brand;
      html+=`<div class="group">
        <div class="ghead" onclick="toggleBrand('${esc(brand)}')">
          <span class="ln"></span><span class="diamond">◆</span>
          <div class="gt"><div class="bn">${esc(brand)}<span class="g">&amp;</span></div><div class="sn">${esc(list[0].series||"")}${on?' · 已筛选':''}</div></div>
          <span class="diamond">◆</span><span class="ln r"></span>
        </div>
        <div class="grid">${list.map(cardHTML).join("")}</div></div>`;
    });
  }else{
    const groups=groupBy(zone,"brand");
    if(!groups.length){ html=`<div class="empty">没有匹配的藏品，换个关键词或筛选</div>`; }
    groups.forEach(([brand,list])=>{
      const on=state.brand===brand;
      html+=`<div class="group">
        <div class="ghead" onclick="toggleBrand('${esc(brand)}')">
          <span class="ln"></span><span class="diamond">◆</span>
          <div class="gt"><div class="bn">${esc(brand)}<span class="g">&amp;</span></div><div class="sn">${esc(list[0].series||"")}${on?' · 已筛选':''}</div></div>
          <span class="diamond">◆</span><span class="ln r"></span>
        </div>
        <div class="grid">${list.map(cardHTML).join("")}</div></div>`;
    });
  }
  const c=document.getElementById("content"); c.innerHTML=html;
  renderShots(c);
}

function g(title,color,content){
  let body=Array.isArray(content)?content:[content];
  let b="";
  body.forEach(item=>{
    if(typeof item==="string"){ b+=`<p>${item}</p>`; }
    else if(item.tbl){ b+=`<table class="tbl">`+item.tbl.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+`</table>`; }
    else if(item.img){
      const figs=item.img.map((f,i)=>`<figure${item.img.length===1?' class="one"':''}><img src="guide/${f}?v=2" loading="lazy" decoding="async"><figcaption>${item.img.length===1?esc(item.cap||""):i===0?esc(item.cap||""):""}</figcaption></figure>`).join("");
      b+=`<div class="gimg">${figs}</div>`;
    }
  });
  return `<div class="gcard"><div class="gh"><span class="dot" style="background:${color}"></span>${title}</div><div class="gb">${b}</div></div>`;
}

document.getElementById("nav").addEventListener("click",e=>{
  const btn=e.target.closest("button"); if(!btn)return;
  const z=btn.dataset.z; state.z=z;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b===btn));
  state.brand=""; state.cat=""; state.spec=""; document.getElementById("q").value=""; state.q="";
  document.getElementById("content").scrollTop=0; document.getElementById("content").scrollIntoView({behavior:"smooth"});
  render();
});
document.getElementById("q").addEventListener("input",e=>{ state.q=e.target.value; render(); });

document.addEventListener("DOMContentLoaded",()=>{ render(); });
